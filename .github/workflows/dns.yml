name: DNS Sync

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Dry Run
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    container:
      image: octodns/octodns:2025.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test zone selection
        run: python3 scripts/sync-changed-zones.test.py
      - name: OctoDNS Sync (dry run)
        run: python3 scripts/sync-changed-zones.py
        env:
          CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || github.event_name == 'workflow_dispatch'
    environment: production
    container:
      image: octodns/octodns:2025.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test zone selection
        run: python3 scripts/sync-changed-zones.test.py
      - name: OctoDNS Sync
        run: python3 scripts/sync-changed-zones.py --doit
        env:
          CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
